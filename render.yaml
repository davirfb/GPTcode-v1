services:
  - type: web
    name: gptcode-site
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app
    envVars:
      # Assina o cookie de sessão do painel (obrigatório e secreto).
      - key: FLASK_SECRET_KEY
        generateValue: true
      # Login pelo Firebase (Console do Firebase > Configurações do projeto > Seus apps)
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_MEASUREMENT_ID
        sync: false
      # Conta de serviço do Firebase Admin SDK (conteúdo do JSON, em uma linha)
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # Quem pode entrar no painel
      - key: ADMIN_ALLOWED_EMAILS
        sync: false
      - key: ADMIN_ALLOWED_DOMAINS
        value: .ifb.edu.br
      # Endereço público: usado nos links dos e-mails e dos formulários de submissão
      - key: SITE_URL
        sync: false
      # Token para testar a API (Authorization: Bearer <API_TOKEN>). Vazio = só a sessão do painel.
      - key: API_TOKEN
        generateValue: true
