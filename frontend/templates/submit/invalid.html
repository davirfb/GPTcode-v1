{% extends 'base.html' %}
{% block title %}Link inválido | GPTCode{% endblock %}
{% block content %}
<main class="py-5">
  <div class="container text-center" style="max-width:600px; margin-top: 4rem;">
    <div class="card shadow-sm border-0 p-5">
      <div class="mb-4">
        <i class="bi bi-x-circle-fill text-danger" style="font-size:4rem;"></i>
      </div>
      <h2 class="fw-bold mb-3">Link inválido ou expirado</h2>
      <p class="text-muted mb-4">
        Este link é de uso único e já foi utilizado, ou seu prazo de validade expirou.
        Solicite um novo link ao administrador.
      </p>
      <a href="{{ url_for('index') }}" class="btn btn-warning fw-semibold">Voltar ao site</a>
    </div>
  </div>
</main>
{% endblock %}
