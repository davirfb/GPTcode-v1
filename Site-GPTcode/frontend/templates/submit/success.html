{% extends 'base.html' %}
{% block title %}Enviado com sucesso | GPTCode{% endblock %}
{% block content %}
<main class="py-5">
  <div class="container text-center" style="max-width:600px; margin-top: 4rem;">
    <div class="card shadow-sm border-0 p-5">
      <div class="mb-4">
        <i class="bi bi-check-circle-fill text-success" style="font-size:4rem;"></i>
      </div>
      <h2 class="fw-bold mb-3">Enviado com sucesso!</h2>
      <p class="text-muted mb-4">
        Sua submissao foi recebida e aguarda revisao pela equipe administrativa.
        Assim que for aprovada, as informacoes aparecerao no site.
      </p>
      <a href="{{ url_for('index') }}" class="btn btn-warning fw-semibold">Voltar ao site</a>
    </div>
  </div>
</main>
{% endblock %}
